apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.dbAppName }}
  labels:
    app: {{ .Values.dbAppName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.dbAppName }}
  template:
    metadata:
      labels:
        app: {{ .Values.dbAppName }}
    spec:
      containers:
        - name: db
          image: {{ .Values.dbImage }}
          imagePullPolicy: Never
          env:
          - name: POSTGRES_USER
            value: "postgres"
          - name: POSTGRES_PASSWORD
            value: "postgres"
          - name: POSTGRES_DB
            value: "merz_search_db"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name:  {{ .Values.dbAppName }}
spec:
  type: ClusterIP
  selector:
    app:  {{ .Values.dbAppName }}
  ports:
    - port: 5432
      targetPort: 5432