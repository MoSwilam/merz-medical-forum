apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.searchAppName }}
  labels:
    app: {{ .Values.searchAppName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.searchAppName }}
  template:
    metadata:
      labels:
        app: {{ .Values.searchAppName }}
    spec:
      containers:
        - name: search
          image: "{{ .Values.searchImage }}:{{ .Values.searchImageTag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.searchAppName }}
  labels:
    app: {{ .Values.searchAppName }}
spec:
  ports:
    - port: 3020
      targetPort: 3002
      nodePort: {{ .Values.searchNodePort }}
      protocol: TCP
  selector:
    app: {{ .Values.searchAppName }}
  type: NodePort
