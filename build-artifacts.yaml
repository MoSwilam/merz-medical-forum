name: Build and Deploy to GKE

on:
  push:
    branches:
      - dev
env:
  IMAGE: europe-west3-docker.pkg.dev/merz-medical-forum/admin/dev
  TAG: ${{ github.sha }}
  HOST: europe-west3-docker.pkg.dev
  GKE_CLUSTER: merz-medical-forum
  GKE_ZONE: europe-west3
jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    environment: dev

    # strategy:
    #   matrix:
    #     node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      # Setup gcloud CLI
      - uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GKE_SA_KEY }}
          project_id: ${{ secrets.GKE_PROJECT }}

      # Configure Docker to use the gcloud command-line tool as a credential
      # helper for authentication
      - run: |-
          gcloud auth configure-docker

      # Get the GKE credentials so we can deploy to the cluster
      - uses: google-github-actions/get-gke-credentials@v1.10.0
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          credentials: ${{ secrets.GKE_SA_KEY }}

      # build docker images
      # Build the Docker image
      - name: Build artifacts
        run: |-
          docker build -t $IMAGE:${{ env.TAG }}  -f apps/admin/Dockerfile .

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.HOST }} --quiet

      - name: Push Docker image to GCR
        run: |
          docker push $IMAGE:${{ env.TAG }}

      # # Optionally, tag the image as 'latest' and push
      # - name: Tag and push latest image
      #   run: |
      #     docker tag gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE }}:$GITHUB_SHA gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE }}:latest
      #     docker push gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE }}:latest

